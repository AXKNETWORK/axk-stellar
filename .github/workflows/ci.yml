name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path contracts/Cargo.toml
      - run: cargo build --release --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A committed Stellar seed is unrecoverable once pushed: the account has to
      # be drained and replaced. Cheaper to fail the build.
      - name: Refuse Stellar secret seeds
        run: |
          if grep -rInE '\bS[A-Z2-7]{55}\b' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::A Stellar secret seed is present in the tree."
            exit 1
          fi
          echo "No secret seeds found."
